<!DOCTYPE html>
<html lang="eng">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width">
    <title>Find a Recipe</title>
    <link href="style.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" rel="stylesheet">
    <script src="app.js" defer></script>   
  </head>
  <body>
   <h1>Find your Recipe</h1>
        <div id="search-bar">
          <input name="search-bar" id="search-input" type="text" placeholder="Enter a Meal Name">
            <button type="button" id="search-btn">Search</button>
        </div>
        <div id="category-section">
          <h2 class="category-h2">Browse by Category</h2>
          <div id="categories" class="category-grid"></div>
        </div>

  <div id="cuisine-section">
          <h2 id="cuisine-h2">Browse by Cuisine</h2>
          <div id="cuisines" class="cuisine-grid"></div>
        </div>

        <div id="results" class="meal"></div>

      </body>
</html>
